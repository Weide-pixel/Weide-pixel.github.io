<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.2.2/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.2.2/core.js">
    </script>
</head>

<body>

    <h1>HTML + Python</h1>

    <button py-click="hello()">執行 Python</button>

    <p id="result"></p>

    <py-script>
def hello():
    result = 10 + 20
    document.querySelector("#result").innerText = f"Python 結果：{result}"
    </py-script>

</body>
</html>
